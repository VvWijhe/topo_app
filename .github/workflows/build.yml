name: APK bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    env:
      # Wachtwoord van de Play Store upload-sleutel (Settings → Secrets → Actions). Zonder secret: alleen de APK.
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      # Sleutel van het Play Console-serviceaccount (JSON). Zonder secret: geen automatische upload.
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    # Vast image: daarop staat de Android SDK al geïnstalleerd (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # volledige geschiedenis: het versienummer telt de commits

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: APK bouwen
        run: |
          echo "Android SDK: $ANDROID_HOME"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          echo "VERSION=$(./gradlew -q --no-daemon :app:printVersionName | tail -1)" >> "$GITHUB_ENV"
        continue-on-error: false

      - name: Play Store-bundel bouwen (.aab)
        if: env.UPLOAD_KEY_PASSWORD != ''
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee -a build.log
          cp app/build/outputs/bundle/release/app-release.aab "lodestar-${VERSION}.aab"
          echo "AAB=lodestar-${VERSION}.aab" >> "$GITHUB_ENV"

      - name: Bouwfouten tonen
        if: failure()
        run: |
          # Kotlin-fouten ("e: ...") en Gradle-meldingen als annotaties, zodat ze bovenaan de run staan.
          { grep -E "^e: " build.log; grep -E -A2 "What went wrong" build.log; } | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          echo '## Bouwfouten' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E -A3 "^e: |What went wrong" build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: APK als artefact bewaren
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Oude .aab-bestanden van de openbare pagina halen (die bevatten het upload-certificaat).
      - name: Oude bundels van de releasepagina halen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view laatste --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep '\.aab$' | while read -r a; do
            gh release delete-asset laatste "$a" --repo "$GITHUB_REPOSITORY" -y || true
          done

      # Zet de nieuwste APK op een vaste downloadpagina: Releases → "Topo (laatste versie)"
      - name: Publiceren als 'laatste' release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: laatste
          name: Lodestar ${{ env.VERSION }} (laatste versie)
          body: |
            Versie ${{ env.VERSION }}, automatisch gebouwd uit commit ${{ github.sha }}.
            - **app-debug.apk**: direct installeren op je telefoon ("Lodestar dev").
            De Play Store-versie wordt automatisch naar de interne test geüpload.
          prerelease: true
          make_latest: false
          # De .aab gaat alleen naar de Play Store, niet op deze openbare pagina (het certificaat bevat je naam).
          files: app/build/outputs/apk/debug/app-debug.apk

      # Elke nieuwe versie automatisch naar de interne test in de Play Store.
      - name: Uploaden naar Play Store (interne test)
        if: env.PLAY_JSON != '' && env.AAB != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.vanwijhe.lodestar
          releaseFiles: ${{ env.AAB }}
          releaseName: Lodestar ${{ env.VERSION }}
          tracks: internal
          status: completed
