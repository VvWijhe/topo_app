name: APK bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bouwen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK als artefact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: topo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Zet de nieuwste APK op een vaste downloadpagina: Releases → "laatste"
      - name: Publiceren als 'laatste' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: laatste
          name: Topo (laatste versie)
          body: |
            Automatisch gebouwd uit commit ${{ github.sha }}.
            Download **app-debug.apk** hieronder en open het bestand op je telefoon.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
